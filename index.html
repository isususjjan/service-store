<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- منع التكبير والتصغير وتثبيت حجم الشاشة -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الخدمات الإحترافي</title>
    <!-- استدعاء خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase (قاعدة البيانات الحقيقية) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: #000000;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --green-accent: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gold-accent: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --blue-accent: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #000000 !important;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
        }

        /* زر قناتك (تيليجرام) */
        .telegram-btn {
            position: fixed;
            bottom: 65px;
            left: 20px;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #3bcbf7 0%, #00a4e4 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 22px rgba(0, 164, 228, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 99999;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            overflow: hidden;
        }

        .telegram-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 28px rgba(0, 164, 228, 0.65);
        }

        .telegram-btn:active {
            transform: scale(0.95);
        }

        .telegram-btn svg {
            width: 34px;
            height: 34px;
            fill: white;
            margin-top: -3px;
            margin-right: -2px;
        }

        .telegram-btn .ad-text {
            position: absolute;
            bottom: 5px;
            left: 7px;
            font-size: 12px;
            font-weight: 800;
            color: white;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* 👑 (تم حذف الوترمارك) 👑 */

        /* كارت التطبيق الرئيسي */
        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 400px;
            max-height: 95vh;
            overflow-y: auto;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            animation: fadeIn 0.5s ease;
        }

        .app-card::-webkit-scrollbar {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .header h2 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .balance-box label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .balance-box .points {
            font-size: 30px;
            font-weight: 800;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 10px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .btn .icon {
            font-size: 20px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-gift {
            background: var(--gold-accent);
            border: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
        }

        .btn-views {
            background: var(--primary-accent);
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .btn-code {
            background: var(--blue-accent);
            border: none;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
        }

        .btn-vip {
            background: var(--green-accent);
            border: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .code-container {
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
        }

        .code-container input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            outline: none;
            text-align: center;
        }

        .code-container button {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .alert-box {
            background: rgba(15, 23, 42, 0.6);
            border-right: 4px solid #818cf8;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse-anim {
            animation: pulse 0.3s ease-in-out;
        }

        /* ============ شاشة تسجيل الدخول ============ */
        #loginScreen {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 36px 26px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            animation: fadeIn 0.5s ease;
            text-align: center;
        }

        .login-logo {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: var(--primary-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 18px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        #loginScreen h2 {
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        #loginScreen p.sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 28px;
            line-height: 1.8;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 18px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .login-divider::before,
        .login-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .login-status {
            font-size: 12px;
            color: var(--text-muted);
            min-height: 18px;
            margin-top: 6px;
        }

        .login-status.error {
            color: #ef4444;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 18px;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .auth-tab.active {
            background: var(--primary-accent);
            color: #ffffff;
        }

        .auth-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 13px 14px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: right;
            outline: none;
        }

        .auth-input:focus {
            border-color: #818cf8;
        }

        .auth-submit-btn {
            width: 100%;
            background: var(--primary-accent);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
            margin-top: 4px;
        }

        .auth-submit-btn:active {
            transform: scale(0.97);
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 16px;
        }

        .avatar-initial {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .user-chip .info {
            text-align: right;
            flex: 1;
        }

        .user-chip .email {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
        }

        .logout-link {
            font-size: 11px;
            color: #818cf8;
            cursor: pointer;
            text-decoration: underline;
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- ============ شاشة تسجيل الدخول ============ -->
<div id="loginScreen">
    <div class="login-logo">⚡</div>
    <h2>متجر الخدمات الذكي</h2>
    <p class="sub">سجّل دخول أو أنشئ حساب جديد عشان تحفظ نقاطك على هذا الجهاز</p>

    <div class="auth-tabs">
        <button class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">تسجيل الدخول</button>
        <button class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">حساب جديد</button>
    </div>

    <input type="email" class="auth-input" id="authEmail" placeholder="البريد الإلكتروني" autocomplete="email">
    <input type="password" class="auth-input" id="authPassword" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="auth-submit-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">تسجيل الدخول</button>

    <div class="login-divider">أو</div>
    <button class="btn btn-outline" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); color:var(--text-muted); padding:12px; border-radius:14px; font-size:13px; font-weight:600; cursor:pointer;" onclick="continueAsGuest()">
        الدخول كزائر (بدون حفظ التقدم)
    </button>

    <div class="login-status" id="loginStatus"></div>
</div>

<!-- زر قناة التيليجرام - يظهر بس بعد تسجيل الدخول -->
<a href="https://t.me/yet_another_developers_en" target="_blank" class="telegram-btn hidden" id="telegramBtn" title="قناة المطور">
    <svg viewBox="0 0 24 24">
        <path d="M9.78 18.65l.28-4.2 7.63-6.88c.34-.31-.08-.48-.53-.18l-9.44 5.94-4.08-1.28c-.89-.28-.9-.89.19-1.32L21.41 3.8c.82-.33 1.54.19 1.27 1.29L19.4 19.34c-.28 1.28-1.04 1.6-2.11 1.0l-5.32-3.92-2.57 2.47c-.28.28-.52.52-1.06.52z"/>
    </svg>
    <span class="ad-text">AD</span>
</a>

<div class="app-card hidden" id="appCard">
    <div class="header">
        <span class="badge">شاشة ثابتة V2.5</span>
        <h2>⚡ متجر الخدمات الذكي</h2>
    </div>

    <!-- بطاقة المستخدم المسجل دخوله -->
    <div class="user-chip hidden" id="userChip">
        <div class="avatar-initial" id="userAvatarInitial">?</div>
        <div class="info">
            <div class="email" id="userEmail"></div>
        </div>
        <span class="logout-link" onclick="signOutUser()">خروج</span>
    </div>


    <!-- صندوق الرصيد -->
    <div class="balance-box">
        <label>نقاطك المتاحة</label>
        <div class="points" id="userPoints">
            <span id="pointsValue">100</span>
            <span style="font-size: 22px;">🪙</span>
        </div>
    </div>

    <!-- شبكة الأزرار -->
    <div class="grid">
        <button class="btn btn-gift" onclick="getDailyGift()">
            <span class="icon">🎁</span>
            <span>الهدية اليومية</span>
        </button>

        <button class="btn btn-views" onclick="buyViews()">
            <span class="icon">👁️</span>
            <span>شراء مشاهدات</span>
        </button>

        <button class="btn btn-code" onclick="toggleCodeBox()">
            <span class="icon">💳</span>
            <span>إدخال كود</span>
        </button>

        <button class="btn btn-vip" onclick="checkVip()">
            <span class="icon">👑</span>
            <span>عضوية VIP</span>
        </button>
    </div>

    <!-- حقل إدخال الكود -->
    <div id="codeSection" style="display: none;">
        <div class="code-container">
            <input type="text" id="giftCodeInput" placeholder="أدخل الكود (جرب: FREE50)">
            <button onclick="redeemCode()">تفعيل</button>
        </div>
    </div>

    <!-- شريط الرسائل -->
    <div class="alert-box" id="statusMessage">
        <span>💡</span>
        <span id="statusText">تم ضبط موضع النص على ارتفاع 22px!</span>
    </div>
</div>

<script>
    /* ====== ربط حقيقي بقاعدة بيانات Supabase (يحفظ التقدم للأبد حتى لو حذفت التطبيق) ====== */
    const SUPABASE_URL = "https://zopepxlwqhkldesfnalp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VprQagPam4r1KPA9aW_HTA_8FtamovX";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null; // { id, email }
    let authMode = "login"; // login | register

    function switchAuthTab(mode) {
        authMode = mode;
        document.getElementById('tabLoginBtn').classList.toggle('active', mode === 'login');
        document.getElementById('tabRegisterBtn').classList.toggle('active', mode === 'register');
        document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
        document.getElementById('loginStatus').textContent = '';
        document.getElementById('loginStatus').classList.remove('error');
    }

    function setAuthBusy(busy, label) {
        const btn = document.getElementById('authSubmitBtn');
        btn.disabled = busy;
        if (busy) btn.textContent = label || "جاري التحميل...";
        else btn.textContent = authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
    }

    async function handleAuthSubmit() {
        const status = document.getElementById('loginStatus');
        const email = document.getElementById('authEmail').value.trim().toLowerCase();
        const password = document.getElementById('authPassword').value;
        status.classList.remove('error');
        status.textContent = '';

        if (!email || !password) {
            status.textContent = "عبّي البريد الإلكتروني وكلمة المرور.";
            status.classList.add('error');
            return;
        }
        if (password.length < 6) {
            status.textContent = "كلمة المرور لازم تكون 6 أحرف على الأقل.";
            status.classList.add('error');
            return;
        }

        if (authMode === 'register') {
            setAuthBusy(true, "جاري إنشاء الحساب...");
            const { data, error } = await db.auth.signUp({ email, password });
            setAuthBusy(false);
            if (error) {
                status.textContent = translateAuthError(error.message);
                status.classList.add('error');
                return;
            }
            if (data.session) {
                // ما فيه تأكيد إيميل مطلوب، دخل فوراً
                await afterAuthSuccess(data.user);
            } else {
                status.textContent = "تم إنشاء الحساب! افتح إيميلك واضغط رابط التأكيد، بعدين رجع سجل دخول.";
                switchAuthTab('login');
            }
        } else {
            setAuthBusy(true, "جاري تسجيل الدخول...");
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            setAuthBusy(false);
            if (error) {
                status.textContent = translateAuthError(error.message);
                status.classList.add('error');
                return;
            }
            await afterAuthSuccess(data.user);
        }
    }

    function translateAuthError(msg) {
        if (msg.includes("Invalid login credentials")) return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        if (msg.includes("User already registered")) return "فيه حساب مسجل بهذا الإيميل من قبل، جرب تسجل دخول.";
        if (msg.includes("Email not confirmed")) return "لازم تأكد إيميلك أول (شيك على بريدك الوارد).";
        return "حصل خطأ: " + msg;
    }

    async function afterAuthSuccess(user) {
        currentUser = { id: user.id, email: user.email };

        // نجيب بيانات النقاط، ولو أول مرة ننشئها
        let { data: profile, error } = await db
            .from('user_progress')
            .select('*')
            .eq('id', user.id)
            .single();

        if (!profile) {
            const { data: created } = await db
                .from('user_progress')
                .insert({ id: user.id, email: user.email, points: 100, has_taken_gift: false, is_vip: false })
                .select()
                .single();
            profile = created;
        }

        points = profile.points;
        hasTakenGift = profile.has_taken_gift;
        isVip = profile.is_vip;
        showApp();
    }

    async function persistCurrentUserData() {
        if (!currentUser) return;
        await db
            .from('user_progress')
            .update({ points, has_taken_gift: hasTakenGift, is_vip: isVip, updated_at: new Date().toISOString() })
            .eq('id', currentUser.id);
    }

    function continueAsGuest() {
        currentUser = null;
        points = 100;
        hasTakenGift = false;
        isVip = false;
        showApp();
    }

    async function signOutUser() {
        if (currentUser) await db.auth.signOut();
        currentUser = null;
        document.getElementById('appCard').classList.add('hidden');
        document.getElementById('telegramBtn').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginStatus').textContent = "";
        document.getElementById('authEmail').value = "";
        document.getElementById('authPassword').value = "";
        points = 100;
        hasTakenGift = false;
        isVip = false;
    }

    function showApp() {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appCard').classList.remove('hidden');
        document.getElementById('telegramBtn').classList.remove('hidden');
        const chip = document.getElementById('userChip');
        if (currentUser) {
            chip.classList.remove('hidden');
            document.getElementById('userAvatarInitial').textContent = currentUser.email.charAt(0).toUpperCase();
            document.getElementById('userEmail').textContent = currentUser.email;
        } else {
            chip.classList.add('hidden');
        }
        updateUI();
    }

    async function checkAuthOnLoad() {
        const { data: { session } } = await db.auth.getSession();
        if (session && session.user) {
            await afterAuthSuccess(session.user);
        }
        // غير كذا: تبقى شاشة الدخول ظاهرة (الوضع الافتراضي بالصفحة)
    }

    checkAuthOnLoad();

    let points = 100;
    let hasTakenGift = false;
    let isVip = false;

    function updateUI() {
        const pointsEl = document.getElementById('pointsValue');
        const pointsBox = document.getElementById('userPoints');
        
        pointsEl.innerText = points;
        
        pointsBox.classList.remove('pulse-anim');
        void pointsBox.offsetWidth;
        pointsBox.classList.add('pulse-anim');
    }

    function showMessage(msg, type = 'info') {
        const alertBox = document.getElementById('statusMessage');
        const alertText = document.getElementById('statusText');
        
        alertText.innerText = msg;
        
        if (type === 'error') {
            alertBox.style.borderRightColor = '#ef4444';
            alertBox.style.background = 'rgba(239, 68, 68, 0.1)';
        } else if (type === 'success') {
            alertBox.style.borderRightColor = '#10b981';
            alertBox.style.background = 'rgba(16, 185, 129, 0.1)';
        } else {
            alertBox.style.borderRightColor = '#818cf8';
            alertBox.style.background = 'rgba(15, 23, 42, 0.6)';
        }
    }

    function getDailyGift() {
        if (hasTakenGift) {
            showMessage("لقد استلمت الهدية اليومية سابقاً! عد غداً.", "error");
            return;
        }
        points += 20;
        hasTakenGift = true;
        updateUI();
        persistCurrentUserData();
        showMessage("مبروك! تم إضافة +20 نقطة إلى حسابك بنجاح.", "success");
    }

    function buyViews() {
        if (points < 50) {
            showMessage("رصيدك غير كافٍ! تحتاج إلى 50 نقطة لشراء المشاهدات.", "error");
            return;
        }
        points -= 50;
        updateUI();
        persistCurrentUserData();
        showMessage("تم الخصم بنجاح! سيتم إرسال 1,000 مشاهدة فوراً.", "success");
    }

    function toggleCodeBox() {
        const box = document.getElementById('codeSection');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function redeemCode() {
        const input = document.getElementById('giftCodeInput').value.trim();
        if (input === "FREE50") {
            points += 50;
            updateUI();
            persistCurrentUserData();
            showMessage("ممتاز! تم تفعيل كود الهدية وإضافة 50 نقطة.", "success");
            document.getElementById('giftCodeInput').value = '';
        } else if (input === "") {
            showMessage("يرجى إدخال الكود أولاً في الخانة المخصصة.", "error");
        } else {
            showMessage("هذا الكود غير صالح أو تم استخدامه سابقاً.", "error");
        }
    }

    function checkVip() {
        if (isVip) {
            showMessage("عضويتك الحالية: VIP نشطة ومُفعلة 👑", "success");
        } else {
            showMessage("مميزات VIP: خصم 50% على جميع الخدمات وزيادة سرعة التنفيذ.", "info");
        }
    }
</script>

</body>
</html>
